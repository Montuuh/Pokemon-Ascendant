<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fight end — A: the field after</title>
<!-- Mockup for the end-of-fight rework (2026-10-21). Open through the dev server so the game's own art, fonts and
     tokens load: http://localhost:5173/docs/design/ui/mockups/fight-end/stage.html?case=trainer
     Cases: wild · catch · trainer · gym · gym-pick · evolve · defeat · escaped · fled · progress
     ?t=<ms> freezes the reveal at that moment (the storyboard); without it the reveal plays once. -->
<link rel="stylesheet" href="/src/ui/styles/tokens.css?direct">
<style>
@font-face { font-family: 'Baloo 2'; src: url('/src/assets/fonts/Baloo2-VariableFont_wght.ttf') format('truetype'); font-weight: 400 800; }
@font-face { font-family: 'Nunito'; src: url('/src/assets/fonts/Nunito-VariableFont_wght.ttf') format('truetype'); font-weight: 200 1000; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #140f1a; overflow: hidden; font-family: var(--font-body); }
.display { font-family: var(--font-display); font-weight: 700; }
.tabular { font-variant-numeric: tabular-nums; }
.pixel { image-rendering: pixelated; }

/* One unit for the whole screen: 1 % of a 16:9 viewport's height. 10.8 px at 1080 p, 7.2 px at 720 p. */
:root { --u: min(1vh, 0.5625vw); --k: 1.5; }
@media (max-height: 800px) { :root { --k: 1; } }

.screen {
  width: 100vw; height: 100vh;
  display: grid; grid-template-rows: auto 1fr auto;
  background: var(--surface-0); color: var(--ink-primary);
}

/* ── Top bar: the game's, kept. The log's line says the result; the right-hand chip is the progress door. ── */
.topbar {
  position: relative; z-index: 10;
  height: max(44px, calc(5.2 * var(--u)));
  display: flex; align-items: center; gap: calc(1.2 * var(--u));
  padding: 0 calc(1.4 * var(--u));
  background: var(--surface-0); border-bottom: 1px solid var(--border-subtle);
  font-size: var(--type-caption);
}
.burger { width: calc(3.6 * var(--u)); height: calc(3.6 * var(--u)); min-width: 30px; min-height: 30px; border-radius: var(--radius-sm); background: var(--surface-1); display: grid; place-items: center; }
.burger i { width: 45%; height: 2px; background: var(--ink-secondary); box-shadow: 0 -5px 0 var(--ink-secondary), 0 5px 0 var(--ink-secondary); }
.who { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill); background: var(--surface-1); font-weight: 800; }
.log { flex: 1; max-width: 560px; margin: 0 auto; padding: 5px 14px; border-radius: var(--radius-pill); background: var(--surface-1); color: var(--ink-secondary); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.log b { color: var(--ink-primary); }
.progress { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: var(--radius-pill); background: var(--surface-1); border: 1px solid var(--border-strong); font-weight: 800; }
.progress img { width: calc(14px * var(--k)); height: calc(14px * var(--k)); }
.progress .ico { width: calc(16px * var(--k)); height: calc(16px * var(--k)); border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; }
.progress .ico img { width: calc(10px * var(--k)); height: calc(10px * var(--k)); image-rendering: pixelated; }
.progress .new { color: var(--accent-action); }

/* The door, open (case=progress): the list the reward screen printed, one click away. */
.pop {
  position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; width: max(340px, calc(38 * var(--u)));
  background: var(--tip-surface); color: #fff6ec; border-radius: var(--radius-md); padding: 12px 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5);
  display: grid; gap: 8px; font-weight: 600;
}
.pop h4 { margin: 0; font: 800 var(--type-micro)/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: #e0d2c2; }
.pop .row { display: grid; grid-template-columns: auto 1fr 70px auto; gap: 8px; align-items: center; font-size: var(--type-small); }
.pop .row img { width: 22px; height: 22px; }
.pop .bar { height: 6px; border-radius: 99px; background: #4a3e50; overflow: hidden; }
.pop .bar i { display: block; height: 100%; background: var(--accent-action-deep); }
.pop .done { padding: 0 8px; border-radius: 99px; background: var(--accent-action); color: var(--ink-on-accent); font-size: var(--type-micro); font-weight: 800; }
.pop .sep { height: 1px; background: #4a3e50; }
.pop .bond { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: var(--type-small); }

/* ── The stage: the fight's own backdrop, the lights a little up. ─────────────────────────────────────── */
.stage { position: relative; overflow: hidden; background: #1d2a22 var(--bg) center / cover no-repeat; container-type: size; }
.stage::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,34,48,.55) 0%, rgba(42,34,48,.15) 40%, rgba(42,34,48,.35) 100%); }
.stage.lit::after { content: ''; position: absolute; left: 25%; right: 25%; top: -30%; height: 75%; background: radial-gradient(closest-side, rgba(255, 203, 61, .30), transparent); pointer-events: none; }
.stage.grey { filter: saturate(.25) brightness(.85); }

/* The headline: the games' word on a ribbon, then one line in their voice. */
.headline { position: absolute; left: 50%; top: calc(3 * var(--u)); transform: translateX(-50%); z-index: 5; display: grid; justify-items: center; gap: calc(1 * var(--u)); }
.ribbon {
  position: relative; padding: calc(.4 * var(--u)) calc(6 * var(--u)) calc(.6 * var(--u));
  font: 800 calc(6.4 * var(--u))/1 var(--font-display); color: #fff6ec; letter-spacing: .01em;
  text-shadow: 0 3px 0 rgba(58,46,34,.55), 0 0 18px rgba(0,0,0,.35);
  background: linear-gradient(180deg, #f2c230, #d9a51d);
  clip-path: polygon(0 0, 100% 0, calc(100% - 3.2 * var(--u)) 50%, 100% 100%, 0 100%, calc(3.2 * var(--u)) 50%);
  white-space: nowrap;
}
.ribbon.red { background: linear-gradient(180deg, #e84c4c, #c93a3a); }
.ribbon.amber { background: linear-gradient(180deg, #c98a4a, #9a6334); }
.ribbon.slate { background: linear-gradient(180deg, #6b5d78, #4a3e50); }
.voice { padding: calc(.6 * var(--u)) calc(2 * var(--u)); border-radius: var(--radius-pill); background: rgba(26,18,28,.78); color: #fff6ec; font-size: calc(1.9 * var(--u)); font-weight: 700; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.voice b { color: var(--accent-action); }

/* ── Your side: the formation the fight had, each card with what the fight gave it. ───────────────────── */
.side { position: absolute; z-index: 3; }
.slot { position: absolute; }
.slot.b1 { left: 5%; top: 17%; }
.slot.b2 { left: 5%; top: 55%; }
.slot.lead { left: 22.5%; top: 37%; }
.slot.f-lead { left: 54%; top: 37%; }
.slot.f-b1 { left: 71.5%; top: 21%; }
.slot.f-b2 { left: 71.5%; top: 55%; }

.unit {
  --card: calc(26 * var(--u));
  --type: var(--surface-2);
  --night: color-mix(in srgb, var(--type) 16%, var(--tip-surface));
  position: relative; width: var(--card); display: flex; flex-direction: column; gap: 3px;
  padding: 10px 6px 6px; border-radius: var(--radius-md); border: 2px solid var(--border-subtle);
  background: color-mix(in srgb, var(--surface-1) 94%, transparent); box-shadow: 0 8px 18px rgba(0,0,0,.4);
}
.unit.lead { border: 3px solid var(--accent-action); padding: 9px 5px 5px; }
.unit .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 99px; background: var(--surface-3); color: var(--ink-secondary); font-size: var(--type-micro); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; z-index: 2; }
.unit.lead .tag { background: var(--accent-action); color: var(--ink-on-accent); }
.unit.foe.lead { border-color: var(--accent-negative); }
.unit.foe.lead .tag { background: var(--brand-red-deep); color: #fff6ec; }
.unit.foe.ghost .tag, .unit.foe.new .tag { background: var(--surface-3); color: var(--ink-secondary); }
.unit.foe.new { border-color: var(--accent-action); }
.unit.foe.new .tag { background: var(--brand-red-deep); color: #fff6ec; }
.unit .head { display: flex; align-items: center; gap: 4px; min-height: calc(15px * var(--k) + 2px); padding: 0 2px; }
.unit .types { display: flex; flex-direction: column; gap: 1px; }
.unit .types img { height: calc(8px * var(--k) + 4px); image-rendering: pixelated; }
.unit .name { flex: 1; font: 700 var(--type-caption)/1.1 var(--font-display); white-space: nowrap; }
.unit .lv { font-size: var(--type-micro); color: var(--ink-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0 5px; white-space: nowrap; }
.unit .lv.up { background: var(--accent-action); color: var(--ink-on-accent); border-color: var(--accent-action); font-weight: 800; }
.unit .window { position: relative; height: calc(var(--card) * .46); border-radius: var(--radius-sm); overflow: hidden;
  background: radial-gradient(70% 45% at 50% 92%, rgba(0,0,0,.42), transparent 70%), radial-gradient(75% 85% at 50% 60%, color-mix(in srgb, var(--type) 46%, var(--night)), var(--night));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.unit .window img.mon { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%) scaleX(-1); image-rendering: pixelated; }
.unit.foe .window img.mon { transform: translateX(-50%); }
/* What the levels gave, a column down the window's left edge (the game's own chip column): the sprite stands in the
   middle, so the column never covers it. */
.unit .chips { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; z-index: 1; }
.chip { font-size: var(--type-micro); font-weight: 800; border-radius: var(--radius-sm); padding: 0 5px; color: var(--ink-on-accent); white-space: nowrap; box-shadow: 0 0 0 1px var(--ink-on-accent); }
.chip.up { background: var(--accent-positive); }
.chip.warn { background: var(--accent-warning); }
.chip.info { background: var(--brand-cream); }
.chip.gold { background: var(--accent-action); }
.unit .learnrow { justify-content: flex-start; }
.unit .learnrow .new { font-size: var(--type-micro); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-action); }
.unit .learn { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 3px; border-radius: 99px; background: var(--brand-cream); color: var(--ink-on-accent); font-size: var(--type-micro); font-weight: 800; box-shadow: 0 0 0 1px var(--ink-on-accent); }
.unit .learn img { height: calc(8px * var(--k) + 4px); image-rendering: pixelated; }
.unit .row { display: flex; align-items: center; gap: 5px; padding: 0 2px; min-height: 14px; }
.unit .bar { position: relative; flex: 1; height: 7px; border-radius: 99px; background: var(--surface-sunken); overflow: hidden; }
.unit .bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
.unit .hp i.now { background: var(--accent-positive); }
.unit .hp i.gain { background: color-mix(in srgb, var(--accent-positive) 45%, #fff6ec); }
.unit .xp i.was { background: var(--brand-blue); }
.unit .xp i.gain { background: color-mix(in srgb, var(--brand-blue) 35%, #fff6ec); }
.unit .num { font-size: var(--type-micro); color: var(--ink-secondary); white-space: nowrap; min-width: 4.2em; }
.unit .plus { font: 800 var(--type-micro)/1 var(--font-body); color: var(--ink-primary); white-space: nowrap; }
.unit .plus.hp { color: var(--accent-positive); }
.unit .lbl { font-size: var(--type-micro); font-weight: 800; color: var(--ink-muted); width: 1.6em; }
.unit.ko .window img.mon { filter: grayscale(1) brightness(.7); opacity: .55; }
.unit.ko { border-color: #5a4c62; }
.unit .corner { position: absolute; top: -11px; right: -8px; z-index: 3; display: flex; gap: 2px; }
.unit.evo .window { box-shadow: inset 0 0 0 2px #fff6ec, 0 0 22px 4px rgba(255, 246, 236, .55); }
.unit.evo .window img.mon { filter: drop-shadow(0 0 6px #fff) brightness(1.15); }
.unit .evochip { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); }
.unit.ghost { opacity: .42; filter: grayscale(.9); }
.unit.new { border-color: var(--accent-action); }
.unit.new .tag { background: var(--brand-red-deep); color: #fff6ec; }

/* ── Their side: who you beat (a trainer, a Leader and the Badge), what you caught, where it fled. ────── */
/* The trainer steps forward into the room their team left, the team they lost with at their feet. */
.trainer { position: absolute; left: 60%; bottom: 14%; z-index: 2; display: grid; justify-items: center; gap: 8px; }
.trainer.aside { left: auto; right: 7%; }
.trainer img.tr { width: calc(80px * var(--k) * 2); image-rendering: pixelated; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.party { display: inline-flex; gap: 4px; padding: 3px 10px; border-radius: 99px; background: color-mix(in srgb, var(--surface-0) 88%, transparent); border: 1px solid var(--border-subtle); box-shadow: 0 3px 8px rgba(0,0,0,.35); }
.party { align-items: flex-end; padding: 4px 12px; gap: 10px; border-radius: var(--radius-md); }
.party img { image-rendering: pixelated; filter: grayscale(1) brightness(1.05); opacity: .75; }
.case {
  position: absolute; left: 46%; top: 27%; z-index: 4; width: calc(30 * var(--u)); display: grid; justify-items: center; gap: calc(.8 * var(--u));
  padding: calc(2 * var(--u)) calc(2 * var(--u)) calc(1.6 * var(--u)); border-radius: var(--radius-lg);
  background: radial-gradient(80% 70% at 50% 35%, #5a2a3a, #2a1a24); border: 3px solid var(--accent-action);
  box-shadow: 0 0 0 4px rgba(26,18,28,.55), 0 18px 40px rgba(0,0,0,.5), 0 0 60px rgba(255,203,61,.25);
}
.case img { width: calc(17 * var(--u)); filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.case .bname { font: 800 calc(2.8 * var(--u))/1 var(--font-display); color: #fff6ec; }
.case .bsub { font-size: var(--type-micro); letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: #e0d2c2; display: inline-flex; gap: 6px; align-items: center; }
.dot { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 10px; font-weight: 900; font-style: normal; }
.ball-ground { position: absolute; z-index: 2; left: 48%; top: 64%; }
.ball-ground img { width: calc(30px * var(--k) * 2); image-rendering: pixelated; filter: drop-shadow(0 4px 3px rgba(0,0,0,.4)); }
.spark { position: absolute; width: calc(1.4 * var(--u)); height: calc(1.4 * var(--u)); background: #fff6ec; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px #ffcb3d); }
.poof { position: absolute; left: 60%; top: 40%; z-index: 2; width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
.poof .spark { width: calc(2 * var(--u)); height: calc(2 * var(--u)); background: #f5d9ff; filter: drop-shadow(0 0 6px #c57be0); }

/* ── The tray: where the hand was, the fight's spoils as cards; the way on where End Turn stood. ─────── */
.tray { height: max(158px, calc(23 * var(--u))); position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: calc(2 * var(--u)); padding: 0 calc(2.4 * var(--u)) 0 calc(18 * var(--u)); background: var(--surface-0); border-top: 1px solid var(--border-subtle); }
.spoils { display: flex; justify-content: center; align-items: center; gap: calc(1.6 * var(--u)); min-width: 0; }
.spoil {
  --sw: calc(15 * var(--u));
  position: relative; width: var(--sw); height: calc(var(--sw) * 1.28); display: grid; grid-template-rows: auto 1fr auto; gap: 4px;
  padding: 6px; border-radius: var(--radius-md); border: 2px solid var(--border-subtle);
  background: color-mix(in srgb, var(--surface-1) 94%, transparent); box-shadow: 0 8px 16px rgba(0,0,0,.35);
}
.spoil .sh { font: 700 var(--type-caption)/1.1 var(--font-display); padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spoil .sw { position: relative; overflow: hidden; min-height: 0; border-radius: var(--radius-sm); display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 55%, #5a4c62, #2a2230); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.spoil .sw img.px { image-rendering: pixelated; }
.spoil .sf { justify-self: stretch; text-align: center; padding: 2px 4px; border-radius: var(--radius-sm); background: var(--brand-cream); color: var(--ink-on-accent); font-size: var(--type-micro); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.spoil.money .sw { background: radial-gradient(70% 70% at 50% 55%, #6b5a2a, #2a2230); }
.spoil .big { font: 800 calc(3.4 * var(--u))/1 var(--font-display); color: #fff6ec; display: inline-flex; align-items: center; gap: 6px; }
.spoil .big svg { width: calc(3 * var(--u)); height: calc(3 * var(--u)); }
.spoil.rare { border-color: var(--rarity-rare); }
.spoil.relic-gem::after { content: ''; position: absolute; top: -7px; left: -7px; width: 18px; height: 18px; background: var(--rarity-rare); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); box-shadow: 0 0 0 2px #fff; }
.spoil.toll { border-color: var(--accent-warning); }
.spoil.toll .sf { background: var(--accent-warning); }
.spoil.toll .big { color: #ffd0a8; }
.spoil .strike { position: absolute; inset: 0; display: grid; place-items: center; }
.spoil .strike::after { content: ''; width: 80%; height: 4px; background: var(--accent-warning); transform: rotate(-20deg); border-radius: 4px; box-shadow: 0 0 0 2px #2a2230; }
.spoil .x { position: absolute; right: 6px; bottom: 6px; font: 800 var(--type-micro)/1 var(--font-body); color: #fff6ec; background: rgba(0,0,0,.45); padding: 1px 5px; border-radius: 99px; }
.note { display: grid; justify-items: center; gap: 8px; color: var(--ink-secondary); font-size: var(--type-small); }
.note .pills { display: flex; gap: 8px; }
.pill { padding: 3px 12px; border-radius: 99px; border: 1px solid var(--border-subtle); background: var(--surface-1); color: var(--ink-secondary); font-weight: 800; font-size: var(--type-caption); }
.pill.bond { color: var(--ink-primary); }

/* The pick, when there is one: the same tray, its cards three relics to take one of. */
.pickhead { position: absolute; left: calc(18 * var(--u)); right: calc(30 * var(--u)); top: calc(-5.4 * var(--u)); display: flex; justify-content: center; }
.pickhead span { padding: calc(.5 * var(--u)) calc(2 * var(--u)); border-radius: var(--radius-pill); background: rgba(26,18,28,.85); color: #fff6ec; font: 800 calc(2.2 * var(--u))/1.1 var(--font-display); display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.relic { --rw: calc(30 * var(--u)); width: var(--rw); height: calc(17 * var(--u)); display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; column-gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); border: 2px solid var(--border-subtle); background: var(--surface-1); position: relative; box-shadow: 0 8px 16px rgba(0,0,0,.35); }
.relic .ri { grid-row: 1 / 4; width: calc(9 * var(--u)); height: calc(9 * var(--u)); align-self: center; border-radius: var(--radius-sm); display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 55%, #5a4c62, #2a2230); }
.relic .ri img { width: calc(30px * var(--k) * 2); image-rendering: pixelated; }
.relic .rn { font: 700 var(--type-small)/1.15 var(--font-display); }
.relic .rd { font-size: var(--type-micro); color: var(--ink-secondary); line-height: 1.3; }
.relic .rr { font-size: var(--type-micro); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-secondary); display: inline-flex; gap: 5px; align-items: center; }
.relic .rr i { width: 11px; height: 11px; background: var(--rarity-rare); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
.relic.on { border-color: var(--accent-action); box-shadow: 0 0 0 3px var(--accent-action), 0 14px 28px rgba(0,0,0,.45); transform: translateY(calc(-1.6 * var(--u))); }

.go { display: grid; justify-items: center; gap: 6px; }
.btn { min-width: calc(19 * var(--u)); padding: calc(1.2 * var(--u)) calc(3 * var(--u)); border-radius: var(--radius-pill); border: 0; background: var(--accent-action); color: var(--ink-on-accent); font: 800 calc(2.4 * var(--u))/1 var(--font-display); box-shadow: 0 5px 0 var(--accent-action-deep); display: inline-flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; }
.btn.evo { background: linear-gradient(90deg, #fff6ec, #ffcb3d 40%, #fff6ec); }
.btn.quiet { background: var(--surface-1); color: var(--ink-secondary); box-shadow: none; border: 1px solid var(--border-subtle); font-size: calc(1.8 * var(--u)); min-width: 0; padding: calc(.7 * var(--u)) calc(2 * var(--u)); }
.btn.defeat { background: #e0b48a; box-shadow: 0 5px 0 #9a6334; }
.dest { font-size: var(--type-micro); color: var(--ink-secondary); font-weight: 700; letter-spacing: .04em; display: inline-flex; gap: 6px; align-items: center; }
.dest img { width: 14px; height: 14px; opacity: .8; filter: invert(1); }

</style>
</head>
<body>
<div id="app"></div>
<script>
const A = (p) => `/art/${p}`;
const SPR = (id) => A(`pokemon/battle/${id}.gif`);
const TYPE = (t) => A(`icons/type/icon-type-${t}.png`);

const qs = new URLSearchParams(location.search);

const at = []; // [el, start, dur, kind, extra]
const T = (el, start, dur, kind, extra) => { at.push([el, start, dur, kind, extra]); return el; };
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

function unit(m, foe = false) {
  const t0 = m.types[0];
  const lvUp = m.lv && m.lv[1] > m.lv[0];
  const el = h(`<div class="slot ${m.slot}"><div class="unit ${m.slot === 'lead' || m.slot === 'f-lead' ? 'lead' : ''} ${foe ? 'foe' : ''} ${m.ko ? 'ko' : ''} ${m.ghost ? 'ghost' : ''} ${m.new ? 'new' : ''}" style="--type:${TYPEVAR(t0)}">
    <span class="tag">${m.tagText ?? m.place ?? (m.slot === 'f-lead' ? 'Lead' : '')}</span>
    <div class="head"><span class="types">${m.types.map((t) => `<img src="${TYPE(t)}" alt="${t}">`).join('')}</span><span class="name">${m.name}</span>
      <span class="lv tabular">Lv ${Array.isArray(m.lv) ? m.lv[0] : m.lv}</span></div>
    <div class="window"><img class="mon" data-fit src="${SPR(m.id)}" alt=""></div>
    ${m.hp ? `<div class="row"><span class="bar hp"><i class="now"></i><i class="gain"></i></span><span class="num tabular hpnum">${m.hp[0]}/${m.hp[m.hp.length - 1]}</span></div>` : ''}
    ${m.xp ? `<div class="row"><span class="lbl">XP</span><span class="bar xp"><i class="was"></i><i class="gain"></i></span><span class="plus tabular">+${m.gain}</span></div>` : ''}
    <span class="corner"></span>
  </div></div>`);
  const card = el.firstElementChild;
  // HP: the fight's end, then the victory heal on top of it.
  if (m.hp) {
    const [a, b, max] = m.hp.length === 3 ? m.hp : [m.hp[0], m.hp[0], m.hp[1]];
    const now = card.querySelector('.hp .now'), gain = card.querySelector('.hp .gain');
    now.style.width = `${(a / max) * 100}%`;
    gain.style.left = `${(a / max) * 100}%`;
    T(gain, 350, 400, 'grow', (b - a) / max * 100);
    if (b > a) T(card.querySelector('.hpnum'), 350, 400, 'text', [`${a}/${max}`, `${b}/${max}`]);
  }
  if (m.xp) T(card.querySelector('.xp'), m.slot === 'lead' ? 600 : m.slot === 'b1' ? 750 : 900, 700, 'xp', m.xp);
  if (lvUp) {
    const lv = card.querySelector('.lv');
    const wrapAt = (m.slot === 'lead' ? 600 : m.slot === 'b1' ? 750 : 900) + 700 * ((100 - m.xp[0]) / (100 - m.xp[0] + m.xp[1]));
    T(lv, wrapAt, 1, 'swap', [`Lv ${m.lv[0]}`, `Lv ${m.lv[0]} → ${m.lv[1]}`, 'up']);
    if (m.stats) {
      const chips = h(`<div class="chips">${['HP', 'Atk', 'Def', 'Spd'].map((s, i) => `<span class="chip up">${s} +${m.stats[i]}</span>`).join('')}</div>`);
      card.querySelector('.window').append(chips);
      T(chips, wrapAt + 60, 260, 'pop');
    }
    if (m.learn) {
      const l = h(`<div class="row learnrow"><span class="new">New</span><span class="learn"><img src="${TYPE(m.learn.type)}" alt="">${m.learn.name}</span></div>`);
      card.append(l);
      T(l, wrapAt + 200, 260, 'pop');
    }
    if (m.evo) {
      const e = h(`<span class="chip gold evochip">✦ Ready to evolve</span>`);
      card.querySelector('.window').append(e);
      T(card, wrapAt + 250, 1, 'class', 'evo');
      T(e, wrapAt + 250, 300, 'pop');
    }
  }
  if (m.ko) {
    const c = h(`<span class="chip warn">Trauma +1</span>`);
    card.querySelector('.corner').append(c);
    T(c, 500, 260, 'pop');
  }
  if (m.trauma) {
    const c = h(`<span class="chip warn">Trauma +1</span>`);
    card.querySelector('.corner').append(c);
    T(c, 650, 260, 'pop');
  }
  return el;
}

function spoil(s) {
  if (s.kind === 'money') return h(`<div class="spoil money"><span class="sh">Prize money</span><div class="sw"><span class="big tabular" data-count="${s.amount}">${COIN}<span>${s.amount}</span></span></div><span class="sf">Wallet ₽${(s.amount + 150).toLocaleString('en-GB')}</span></div>`);
  if (s.kind === 'toll-money') return h(`<div class="spoil toll money"><span class="sh">Dropped</span><div class="sw"><span class="big tabular">${COIN}<span>−${s.amount}</span></span></div><span class="sf">20 % of the wallet</span></div>`);
  return h(`<div class="spoil ${s.rare ? 'rare relic-gem' : ''}"><span class="sh">${s.name}</span><div class="sw"><img class="${s.big ? '' : 'px'}" src="${A('items/' + s.icon)}" alt="" style="width:${s.big ? 'calc(10.5 * var(--u))' : 'calc(30px * var(--k) * 2)'}"></div><span class="sf">${s.foot}</span></div>`);
}

  app.append(screen);
  const stage = screen.querySelector('.stage');
  const tray = screen.querySelector('.tray');

  // Headline.
  const hl = h(`<div class="headline"><div class="ribbon ${C.ribbon[1]}">${C.ribbon[0]}</div><div class="voice">${C.voice}</div></div>`);

  if (C.pick) {

    C.pick.forEach((r, i) => {

// Sprites at a whole or half multiple of their pixels (D9): the window's height decides the step.
function fit() {
  for (const img of document.querySelectorAll('img[data-fit], img[data-px1]')) {
    const go = () => {
      const box = img.closest('.window, .sw') ?? img.parentElement;
      const target = img.hasAttribute('data-px1') ? (window.innerHeight > 800 ? 48 : 34) : box.clientHeight * 0.86;
      const s = Math.max(1, Math.floor((target / img.naturalHeight) * 2) / 2);
      img.style.width = `${img.naturalWidth * s}px`;
      img.style.height = `${img.naturalHeight * s}px`;
    };
    if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go);
  }
}

const ease = (x) => 1 - Math.pow(1 - x, 3);
const spring = (x) => { const c = 1.70158 * 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function render(t) {
  for (const [el, s, d, kind, x] of at) {
    const p = Math.max(0, Math.min(1, (t - s) / d));
    const on = t >= s;
    switch (kind) {
      case 'fade': el.style.opacity = ease(p); break;
      case 'drop': el.style.opacity = Math.min(1, p * 2); el.style.transform = `translateY(${(1 - spring(p)) * -60}px) scale(${0.85 + 0.15 * spring(p)})`; break;
      case 'pop': el.style.opacity = Math.min(1, p * 2); el.style.transform = `scale(${0.5 + 0.5 * spring(p)})`; break;
      case 'slideIn': el.style.opacity = p; el.style.transform = `translateX(${(1 - ease(p)) * 120}px)`; break;
      case 'deal': el.style.opacity = Math.min(1, p * 2); el.style.transform = `translateY(${(1 - ease(p)) * 80}px) rotate(${(1 - ease(p)) * -8}deg)`; break;
      case 'twinkle': el.style.opacity = p <= 0 ? 0 : p < .5 ? p * 2 : 1 - (p - .5) * 1.2; el.style.transform = `scale(${0.4 + p})`; break;
      case 'grow': el.style.width = `${x * ease(p)}%`; break;
      case 'text': el.textContent = p < 1 && t < s + d ? (t < s ? x[0] : x[1]) : x[1]; break;
      case 'swap': el.textContent = on ? x[1] : x[0]; el.classList.toggle(x[2], on); if (on) el.style.transform = `scale(${t - s < 220 ? 0.7 + 0.3 * spring((t - s) / 220) : 1})`; break;
      case 'class': el.classList.toggle(x, on); break;
      case 'count': el.textContent = Math.round(x * ease(p)); break;
      case 'xp': {
        const [a, b, wraps] = x;
        const was = el.querySelector('.was'), gain = el.querySelector('.gain');
        if (!wraps) { was.style.width = `${a}%`; gain.style.left = `${a}%`; gain.style.width = `${(b - a) * ease(p)}%`; break; }
        // Fill to the end, then start the new level from nothing and fill to where it stands.
        const first = (100 - a) / (100 - a + b);
        if (p < first) { was.style.width = `${a}%`; gain.style.left = `${a}%`; gain.style.width = `${(100 - a) * (p / first)}%`; }
        else { was.style.width = '0%'; gain.style.left = '0%'; gain.style.width = `${b * ((p - first) / (1 - first))}%`; }
        break;
      }
    }
  }
}

build();
fit();
const tq = qs.get('t');
if (tq !== null) render(Number(tq));
else { const t0 = performance.now(); const loop = () => { const t = performance.now() - t0; render(t); if (t < 3000) requestAnimationFrame(loop); }; render(0); requestAnimationFrame(loop); }
window.__t = (t) => render(t);
window.__ready = () => [...document.images].every((i) => i.complete);
</script>
</body>
